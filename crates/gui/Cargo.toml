[package]
name = "selflock-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows GUI for the SelfLock port"
build = "build.rs"

[[bin]]
name = "selflock"
path = "src/main.rs"

[dependencies]
selflock-core = { workspace = true }
selflock-cli = { path = "../cli", version = "1.4.0" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[build-dependencies]
winresource = "0.1"
