name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item target\release\selflock.exe out\selflock.exe
          Copy-Item README.md out\README.md
          Copy-Item COPYING out\COPYING
          Compress-Archive -Path out\* -DestinationPath selflock-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: selflock-windows
          path: selflock-windows.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: selflock-windows.zip
          generate_release_notes: true
